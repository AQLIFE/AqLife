<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
        }
        .component-preview {
            border: 1px solid #ccc;
            padding: 10px;
        }
        .controls {
            min-width: 200px;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        select, input[type="number"] {
            width: 100%;
            margin-top: 5px;
            padding: 5px;
        }
        #tech-tree{width: 100%;height: 100%;}
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <label>
                技术树类型：
                <select id="tree-type">
                    <option value="basic">基础结构</option>
                    <option value="research">研究分支</option>
                    <option value="facility">设施建设</option>
                </select>
            </label>
            <label>
                子节点数量：
                <input type="number" id="child-count" value="3" min="1" max="6">
            </label>
            <button onclick="updateTree()">更新树形图</button>
        </div>
        <div class="component-preview">
            <svg id="tech-tree" viewBox="0 0 800 600"></svg>
        </div>
    </div>

    <script>
        const nodeTypes = {
            basic: {
                color: '#4CAF50',
                label: '基础技术'
            },
            research: {
                color: '#2196F3',
                label: '研究项目'
            },
            facility: {
                color: '#FF9800',
                label: '设施建设'
            }
        };

        function createNode(type, x, y, level = 0) {
            const node = document.createElementNS("http://www.w3.org/2000/svg", "g");
            const size = Math.max(30 - level * 5, 20); // 根据层级调整大小
            
            // 创建节点圆圈
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute('cx', x);
            circle.setAttribute('cy', y);
            circle.setAttribute('r', size);
            circle.setAttribute('fill', nodeTypes[type].color);
            circle.setAttribute('stroke', '#fff');
            circle.setAttribute('stroke-width', '2');
            
            // 添加文字标签
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute('x', x);
            text.setAttribute('y', y);
            text.setAttribute('dy', '0.35em');
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', '#fff');
            text.textContent = `${nodeTypes[type].label}${level ? level : ''}`;
            
            node.appendChild(circle);
            node.appendChild(text);
            return node;
        }

        // 创建带90度折线的连接器
        function createConnection(fromX, fromY, toX, toY) {
            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            
            // 计算折点位置（在父节点下方50像素处）
            const elbowX = Math.min(fromX, toX);
            const elbowY = fromY + 50;
            
            // 创建路径数据
            const pathData = `
                M ${fromX},${fromY}
                V ${elbowY}
                H ${toX}
                L ${toX},${toY}
            `;
            
            line.setAttribute('d', pathData);
            line.setAttribute('stroke', '#ddd');
            line.setAttribute('fill', 'none');
            line.setAttribute('stroke-width', '2');
            return line;
        }

        function updateTree() {
            const canvas = document.getElementById('tech-tree');
            const treeType = document.getElementById('tree-type').value;
            const childCount = parseInt(document.getElementById('child-count').value);

            // 清除现有内容
            canvas.innerHTML = '';
            
            // 创建根节点
            const root = createNode(treeType, 400, 50);
            canvas.appendChild(root);

            // 递归创建子节点
            function createChildren(parentX, parentY, level, count) {
                const spacing = 150 / Math.max(count - 1, 1);
                
                for (let i = 0; i < count; i++) {
                    const childX = parentX - (count - 1) * spacing / 2 + i * spacing;
                    const childY = parentY + 150; // 增加高度以适应折线
                    
                    const child = createNode(treeType, childX, childY, level);
                    canvas.appendChild(child);
                    
                    // 连接线（使用新的90度折线）
                    const connection = createConnection(parentX, parentY + 30, childX, childY - 30);
                    canvas.insertBefore(connection, root);
                    
                    if (level < 2) { // 最多两层嵌套
                        createChildren(childX, childY, level + 1, Math.floor(count / 2));
                    }
                }
            }

            createChildren(400, 50, 0, childCount);
        }

        // 初始调用
        updateTree();
    </script>
</body>
</html>
