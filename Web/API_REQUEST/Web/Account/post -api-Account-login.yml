info:
  name: post /api/Account/login
  type: http
  seq: 4
  tags:
    - Account

http:
  method: POST
  url: "{{baseUrl}}/api/Account/login"
  body:
    type: json
    data: |-
      {
        "accountName": "XVD@Ez-1V",
        "secretKey": "9689QQAI"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: 192.168.0.100:5110
  scripts:
    - type: after-response
      code: |-
        const data = res.getBody();
        if (!data) { throw new Error("Login response does not contain token"); } // 设置到当前 Bruno 环境变量 
        bru.setEnvVar("token", data);
        console.log("Token saved to environment.",data);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

