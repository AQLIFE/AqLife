name: CI

on:
  push:
    branches: [pop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10        
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Apply EF migrations
        working-directory: services/API/APIUnitTest
        run: dotnet ef database update --project Infrastructure --startup-project Web -- --environment Test

      - name: Restore .NET
        working-directory: services/API/APIUnitTest
        run: dotnet restore
      
      - name: Build .NET
        working-directory: services/API/APIUnitTest
        run: dotnet build --no-restore
      
      - name: Run .NET tests
        working-directory: services/API/APIUnitTest
        run: dotnet test --no-build
