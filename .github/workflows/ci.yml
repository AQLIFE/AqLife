name: CI

on:
  push:
    branches: [pop, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: aqlife_tester
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: aqlife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aqlife_tester -d aqlife_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Check EF tool
        run: dotnet tool list

      - name: Apply EF migrations
        env:
          ASPNETCORE_ENVIRONMENT: Test
        run: dotnet tool run dotnet-ef database update --project services/API/PostgreSqlMigrations --startup-project services/API/Web

      - name: Restore .NET
        working-directory: services/API/CoreTest
        run: dotnet restore

      - name: Build .NET
        working-directory: services/API/CoreTest
        run: dotnet build --no-restore

      - name: Run .NET tests
        working-directory: services/API/CoreTest
        run: dotnet test --no-build

  production:
    name: Build Production
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/pop'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Build WEB (Production)
        run: npm run build --workspace=@aqlife/web

      - name: Build MGS (Production)
        run: npm run build --workspace=@aqlife/mgs

      - name: Publish API (Release)
        run: dotnet publish services/API/Web/Web.csproj --configuration Release --output artifacts/api

      - name: Upload WEB runtime
        uses: actions/upload-artifact@v4
        with:
          name: aqlife-web-${{ github.sha }}
          path: apps/Web/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload MGS runtime
        uses: actions/upload-artifact@v4
        with:
          name: aqlife-mgs-${{ github.sha }}
          path: apps/MGS/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload API runtime
        uses: actions/upload-artifact@v4
        with:
          name: aqlife-api-${{ github.sha }}
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 14
